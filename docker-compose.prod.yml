services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vendamais_backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: postgres:17.5-alpine
    container_name: vendamais_db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
