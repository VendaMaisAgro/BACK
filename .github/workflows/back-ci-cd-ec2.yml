name: BACK - CI/CD (EC2)

on:
  push:
    branches: ["main", "infra/ci-cd-back-ec2"]
    paths:
      - "**"
      - ".github/workflows/back-ci-cd-ec2.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/back-ci-cd-ec2.yml"

concurrency:
  group: back-ec2-main
  cancel-in-progress: true

jobs:
  ci:
    name: CI (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: |
          node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts.build?0:1)" \
          && npm run build \
          || npx tsc -p tsconfig.json

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ci]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/infra/ci-cd-back-ec2') && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ghcr.io/vendamaisagro/back:latest
            ghcr.io/vendamaisagro/back:${{ github.sha }}

  deploy:
    name: Deploy (SSH -> EC2)
    runs-on: ubuntu-latest
    needs: [ci, build-and-push]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/infra/ci-cd-back-ec2') && github.event_name == 'push'
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e
            export APP_DIR="${{ secrets.EC2_APP_DIR }}"
            export BRANCH="${{ github.ref_name }}"
            export IMAGE_NAME="ghcr.io/vendamaisagro/back:latest"
            bash "$APP_DIR/scripts/deploy-back.sh"
